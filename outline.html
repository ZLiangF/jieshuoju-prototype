<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>剧本大纲 · 离婚后（15集）</title>
  <link rel="stylesheet" href="css/common.css?v=202610231735" />
</head>
<body class="flow-page">
<div class="app">
  <header class="topbar">
    <div class="tb-left">
      <a class="tb-back" href="index.html" aria-label="返回">‹</a>
      <strong class="flow-title">离婚后（15集）</strong>
      <span class="flow-badge">短剧</span>
    </div>
    <nav class="tb-center steps" aria-label="一键成片步骤">
      <a class="step on" href="outline.html" aria-current="step">
        <span class="step-ico" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 2.5h7.2L13 5.2V13.5H3Z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10 2.6V5.2H12.6M5 8h6M5 10.5h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span>
        <span class="step-text"><strong>剧本大纲</strong><small>已完成</small></span>
      </a>
      <span class="step-sep" aria-hidden="true">›</span>
      <a class="step" href="assets.html">
        <span class="step-ico" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M2.5 4.2 8 2.2l5.5 2v7.2L8 13.8 2.5 11.4Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M2.5 4.2 8 6.4l5.5-2.2M8 6.4v7.4" stroke="currentColor" stroke-width="1.3"/></svg></span>
        <span class="step-text"><strong>资产库</strong><small>调整角色、场景、道具</small></span>
      </a>
      <span class="step-sep" aria-hidden="true">›</span>
      <a class="step" href="episodes.html">
        <span class="step-ico" aria-hidden="true"><svg viewBox="0 0 16 16"><rect x="2.2" y="3.2" width="11.6" height="9.6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 6.2 10.2 8 7 9.8Z" fill="currentColor"/></svg></span>
        <span class="step-text"><strong>分集视频</strong><small>待确认成片方案</small></span>
      </a>
    </nav>
    <div class="tb-right">
      <div class="credit">✦ <span id="credits"></span></div>
      <button class="bell" aria-label="通知"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg></button>
      <div class="avatar"></div>
    </div>
  </header>

  <div class="page">
    <div class="meta-row">
      <div>视频风格<b>真人写实电影风格高清</b></div>
      <div>视频比例<b>9:16</b></div>
      <div>场景比例<b>16:9</b></div>
      <div>当前版本<b>原剧本 / 国内</b></div>
    </div>

    <div class="block-title">剧本摘要</div>
    <section class="card">
      <h3>故事梗概</h3>
      <p id="summary"></p>
      <h3>题材类型</h3>
      <p id="genre"></p>
      <h3>情感基调</h3>
      <p id="tone"></p>
      <h3>时代背景</h3>
      <p id="era"></p>
    </section>

    <div class="block-title">人物关系</div>
    <section class="card">
      <ul class="people" id="people"></ul>
    </section>

    <div class="block-title">剧本内容</div>
    <section class="card">
      <div class="script-head">
        <div style="font-weight:650">分集剧本</div>
        <button class="btn" id="toggle-scripts" type="button">一键展开</button>
      </div>
      <p style="color:#8a8694;margin-bottom:10px">点击分集可展开查看剧本内容，支持一键展开或收起。</p>
      <div id="scripts"></div>
    </section>
  </div>

  <footer class="footer-bar guide-footer">
    <div class="asset-capsule">
      <span class="hint"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1.5" width="10" height="11" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M4.5 4.5h5M4.5 7h5M4.5 9.5h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>剧本内容整理完毕，可以进行下一步了</span>
      <div class="asset-capsule-actions">
        <a class="btn primary" href="assets.html">下一步</a>
      </div>
    </div>
  </footer>
</div>
<script src="js/data.js?v=202610231735"></script>
<script>
  var D = ReplicaData;
  document.getElementById("credits").textContent = ReplicaUI.credits();
  document.getElementById("summary").textContent = D.outline.summary;
  document.getElementById("genre").textContent = D.outline.genre;
  document.getElementById("tone").textContent = D.outline.tone;
  document.getElementById("era").textContent = D.outline.era;
  document.getElementById("people").innerHTML = D.outline.people.map(function (p) {
    return "<li><b>" + p.name + "</b>" + (p.tag ? '<span class="tag">' + p.tag + "</span> " : "") + p.desc + "</li>";
  }).join("");
  document.getElementById("scripts").innerHTML = D.outline.scripts.map(function (s, i) {
    return '<details class="script"' + (i === 0 ? " open" : "") + "><summary>" + (i + 1) + "、" + s.title + "</summary><p>" + s.body + "</p></details>";
  }).join("");
  document.getElementById("toggle-scripts").onclick = function () {
    var items = document.querySelectorAll("#scripts details");
    var open = this.textContent === "一键展开";
    items.forEach(function (el) { el.open = open; });
    this.textContent = open ? "一键收起" : "一键展开";
  };
</script>
</body>
</html>
