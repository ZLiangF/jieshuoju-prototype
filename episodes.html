<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>分集视频 · 离婚后（15集）</title>
  <link rel="stylesheet" href="css/common.css?v=202610231812" />
  <link rel="stylesheet" href="css/episodes.css?v=202610231812" />
</head>
<body class="flow-page">
<div class="app">
  <header class="topbar">
    <div class="tb-left">
      <a class="tb-back" href="index.html" aria-label="返回">‹</a>
      <strong class="flow-title">离婚后（15集）</strong>
      <span class="flow-badge">短剧</span>
    </div>
    <nav class="tb-center steps" aria-label="一键成片步骤">
      <a class="step is-done" href="outline.html">
        <span class="step-ico" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 2.5h7.2L13 5.2V13.5H3Z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10 2.6V5.2H12.6M5 8h6M5 10.5h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span>
        <span class="step-text"><strong>剧本大纲</strong><small>已完成</small></span>
      </a>
      <span class="step-sep" aria-hidden="true">›</span>
      <a class="step" href="assets.html">
        <span class="step-ico" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M2.5 4.2 8 2.2l5.5 2v7.2L8 13.8 2.5 11.4Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M2.5 4.2 8 6.4l5.5-2.2M8 6.4v7.4" stroke="currentColor" stroke-width="1.3"/></svg></span>
        <span class="step-text"><strong>资产库</strong><small>调整角色、场景、道具</small></span>
      </a>
      <span class="step-sep" aria-hidden="true">›</span>
      <a class="step on" href="episodes.html" aria-current="step">
        <span class="step-ico" aria-hidden="true"><svg viewBox="0 0 16 16"><rect x="2.2" y="3.2" width="11.6" height="9.6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 6.2 10.2 8 7 9.8Z" fill="currentColor"/></svg></span>
        <span class="step-text"><strong>分集视频</strong><small>待确认成片方案</small></span>
      </a>
    </nav>
    <div class="tb-right">
      <div class="credit">✦ <span id="credits"></span></div>
      <button class="bell" aria-label="通知"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg></button>
      <div class="avatar"></div>
    </div>
  </header>

  <div class="page">
    <div class="toolbar ep-toolbar">
      <div class="ep-toolbar-left">
        <b id="ep-count">共 0 集</b>
        <div class="ep-filters" id="ep-filters" role="tablist" aria-label="按状态筛选"></div>
      </div>
      <div class="ep-toolbar-right">
        <label class="ep-search">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m10.6 10.6 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <input id="ep-search" type="search" placeholder="搜索集名" aria-label="搜索集名" />
        </label>
        <button class="icon-round" id="add-ep" title="新增分集" aria-label="新增分集">＋</button>
      </div>
    </div>
    <div class="ep-wrap" id="eps"></div>
    <div class="ep-empty" id="ep-empty" hidden>没有符合条件的分集</div>
  </div>
</div>

<div class="style-mask" id="oc-mask">
  <div class="oc-sheet" role="dialog" aria-modal="true" aria-labelledby="oc-title">
    <div class="oc-head">
      <div>
        <h2 id="oc-title">一键成片</h2>
        <p id="oc-desc"></p>
      </div>
      <button class="style-close" id="oc-close" type="button" aria-label="关闭">✕</button>
    </div>
    <div class="oc-body">
      <div class="oc-pair">
        <div class="oc-field">
          <div class="label">模型</div>
          <select id="oc-model">
            <option value="v25">解说剧 V 2.5</option>
            <option value="v20">解说剧 V 2.0</option>
          </select>
        </div>
        <div class="oc-field">
          <div class="label">分辨率</div>
          <select id="oc-res">
            <option value="480P">480P</option>
            <option value="720P">720P</option>
            <option value="1080P">1080P</option>
          </select>
        </div>
      </div>
      <div class="oc-v20" id="oc-v20">
        <div class="oc-field" id="oc-speed-field">
          <div class="label">语速 <span class="hint">支持 1.0–1.5，默认 1.3</span></div>
          <input id="oc-speed" type="number" min="1" max="1.5" step="0.1" />
          <div class="oc-err" id="oc-speed-err"></div>
        </div>
        <div class="oc-pair">
          <div class="oc-field">
            <div class="label">是否对口型</div>
            <div class="oc-switch-row"><span class="hint">默认关</span><button class="oc-switch" id="oc-lip" type="button" aria-label="是否对口型"></button></div>
          </div>
          <div class="oc-field">
            <div class="label">是否添加字幕</div>
            <div class="oc-switch-row"><span class="hint">默认关</span><button class="oc-switch" id="oc-sub" type="button" aria-label="是否添加字幕"></button></div>
          </div>
        </div>
        <div class="oc-field">
          <div class="label">上传音频 <span class="hint">可选 · mp3 / wav / m4a，≤100MB</span></div>
          <button class="oc-upload" id="oc-upload" type="button"><b>点击上传音频</b><br />不上传则使用系统配音</button>
          <div class="oc-file" id="oc-file">
            <span>本集旁白.mp3 · 8.4 MB · 01:12</span>
            <div class="ops">
              <button type="button" id="oc-play">试听</button>
              <button type="button" id="oc-reup">重传</button>
              <button type="button" id="oc-del">删除</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="oc-foot">
      <span class="oc-tip" id="oc-tip"></span>
      <button class="btn" id="oc-cancel" type="button">取消</button>
      <button class="btn purple" id="oc-ok" type="button"></button>
    </div>
  </div>
</div>

<div class="style-mask" id="ds-mask">
  <div class="oc-sheet" role="dialog" aria-modal="true" aria-labelledby="ds-title">
    <div class="oc-head">
      <div>
        <h2 id="ds-title">确认生成导演级分镜？</h2>
        <p>请选择分辨率。系统将基于剧本生成导演级分镜内容。</p>
      </div>
      <button class="style-close" id="ds-close" type="button" aria-label="关闭">✕</button>
    </div>
    <div class="oc-body">
      <div class="oc-field">
        <div class="label">分辨率</div>
        <select id="ds-res">
          <option value="480P">480P</option>
          <option value="720P">720P</option>
          <option value="1080P">1080P</option>
        </select>
      </div>
      <div class="ds-credit" id="ds-credit"></div>
    </div>
    <div class="oc-foot">
      <button class="btn" id="ds-cancel" type="button">取消</button>
      <button class="btn purple" id="ds-ok" type="button">确认生成</button>
    </div>
  </div>
</div>

<script src="js/data.js?v=202610231812"></script>
<script src="js/episodes.js?v=202610231812"></script>
</body>
</html>
