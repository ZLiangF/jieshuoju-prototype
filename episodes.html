<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>分集视频 · 离婚后（15集）</title>
  <link rel="stylesheet" href="css/product.css?v=202610141134" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="tb-left">
      <a class="tb-back" href="index.html">‹ 离婚后（15集）</a>
    </div>
    <div class="tb-center steps">
      <a class="step" href="outline.html">剧本大纲</a>
      <span style="color:#555">›</span>
      <a class="step" href="assets.html">资产库</a>
      <span style="color:#555">›</span>
      <a class="step on" href="episodes.html">分集视频</a>
    </div>
    <div class="tb-right">
      <div class="credit">✦ <span id="credits"></span></div>
      <button class="bell" aria-label="通知"></button>
      <div class="avatar"></div>
    </div>
  </header>

  <div class="page">
    <div class="toolbar">
      <div style="display:flex;align-items:center;gap:10px">
        <b id="ep-count">共 0 集</b>
        <input class="search" placeholder="输入集名，按回车进行搜索" />
      </div>
      <div style="display:flex;gap:8px">
        <button class="icon-round" title="刷新">↻</button>
        <button class="icon-round" id="add-ep" title="新增">＋</button>
      </div>
    </div>
    <div class="ep-wrap" id="eps"></div>
  </div>
</div>

<div class="style-mask" id="oc-mask">
  <div class="oc-sheet" role="dialog" aria-modal="true" aria-labelledby="oc-title">
    <div class="oc-head">
      <div>
        <h2 id="oc-title">一键成片</h2>
        <p id="oc-desc"></p>
      </div>
      <button class="style-close" id="oc-close" type="button" aria-label="关闭">✕</button>
    </div>
    <div class="oc-body">
      <div class="oc-pair">
        <div class="oc-field">
          <div class="label">模型</div>
          <select id="oc-model">
            <option value="v25">解说剧 V 2.5</option>
            <option value="v20">解说剧 V 2.0</option>
          </select>
        </div>
        <div class="oc-field">
          <div class="label">分辨率</div>
          <select id="oc-res">
            <option value="480P">480P</option>
            <option value="720P">720P</option>
            <option value="1080P">1080P</option>
          </select>
        </div>
      </div>
      <div class="oc-v20" id="oc-v20">
        <div class="oc-field" id="oc-speed-field">
          <div class="label">语速 <span class="hint">支持 1.0–1.5，默认 1.3</span></div>
          <input id="oc-speed" type="number" min="1" max="1.5" step="0.1" />
          <div class="oc-err" id="oc-speed-err"></div>
        </div>
        <div class="oc-pair">
          <div class="oc-field">
            <div class="label">是否对口型</div>
            <div class="oc-switch-row"><span class="hint">默认关</span><button class="oc-switch" id="oc-lip" type="button" aria-label="是否对口型"></button></div>
          </div>
          <div class="oc-field">
            <div class="label">是否添加字幕</div>
            <div class="oc-switch-row"><span class="hint">默认关</span><button class="oc-switch" id="oc-sub" type="button" aria-label="是否添加字幕"></button></div>
          </div>
        </div>
        <div class="oc-field">
          <div class="label">上传音频 <span class="hint">可选 · mp3 / wav / m4a，≤100MB</span></div>
          <button class="oc-upload" id="oc-upload" type="button"><b>点击上传音频</b><br />不上传则使用系统配音</button>
          <div class="oc-file" id="oc-file">
            <span>本集旁白.mp3 · 8.4 MB · 01:12</span>
            <div class="ops">
              <button type="button" id="oc-play">试听</button>
              <button type="button" id="oc-reup">重传</button>
              <button type="button" id="oc-del">删除</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="oc-foot">
      <span class="oc-tip" id="oc-tip"></span>
      <button class="btn" id="oc-cancel" type="button">取消</button>
      <button class="btn purple" id="oc-ok" type="button"></button>
    </div>
  </div>
</div>

<div class="style-mask" id="ds-mask">
  <div class="oc-sheet" role="dialog" aria-modal="true" aria-labelledby="ds-title">
    <div class="oc-head">
      <div>
        <h2 id="ds-title">确认生成导演级分镜？</h2>
        <p>请选择分辨率。系统将基于剧本生成导演级分镜内容。</p>
      </div>
      <button class="style-close" id="ds-close" type="button" aria-label="关闭">✕</button>
    </div>
    <div class="oc-body">
      <div class="oc-field">
        <div class="label">分辨率</div>
        <select id="ds-res">
          <option value="480P">480P</option>
          <option value="720P">720P</option>
          <option value="1080P">1080P</option>
        </select>
      </div>
      <div class="ds-credit" id="ds-credit"></div>
    </div>
    <div class="oc-foot">
      <button class="btn" id="ds-cancel" type="button">取消</button>
      <button class="btn purple" id="ds-ok" type="button">确认生成</button>
    </div>
  </div>
</div>

<script src="js/data.js?v=202610141134"></script>
<script src="js/episodes.js?v=202610141134"></script>
</body>
</html>
