<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多轨编辑器 · 第1集：墓地贺芷提离婚协议</title>
  <link rel="stylesheet" href="css/common.css?v=202611032159" />
  <link rel="stylesheet" href="css/multitrack-editor.css?v=202611032159" />
  <link rel="stylesheet" href="css/multitrack-timeline.css?v=202611032159" />
</head>
<body class="mt-page">
<div class="mt-app">
  <header class="mt-topbar">
    <div class="mt-top-left">
      <a class="mt-back" href="workspace.html" aria-label="返回工作台">‹</a>
      <span class="mt-logo" aria-hidden="true">▦</span>
      <strong>多轨编辑器</strong>
      <span class="mt-sep">·</span>
      <span class="mt-subtitle">第1集</span>
      <span class="mt-saved" id="save-status" role="status" aria-live="polite"><i></i><span>已保存</span></span>
    </div>
    <div class="mt-top-right">
      <span class="mt-credits" title="积分余额"><i>✦</i><b id="credits">0</b></span>
      <button type="button" class="mt-ratio" data-act="ratio">9:16⌄</button>
      <button type="button" class="mt-round" data-act="save" title="保存" aria-label="保存">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h8l2 2v9H3zM5 2.5v4h5v-4M5.5 10h5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button type="button" class="mt-collapse" data-act="collapse-preview">收起预览</button>
      <button type="button" class="mt-collapse" data-act="collapse-inspector">收起设置</button>
      <div class="mt-export-wrap">
        <button type="button" class="mt-export" data-act="export" aria-haspopup="menu" aria-expanded="false">导出 <span>⌄</span></button>
        <div class="mt-export-menu" id="export-menu" role="menu" hidden>
          <button type="button" role="menuitem" data-act="export-video">导出成片</button>
          <button type="button" role="menuitem" data-act="export-xml">导出 XML</button>
        </div>
      </div>
    </div>
  </header>

  <main class="mt-main">
    <aside class="mt-library" aria-label="素材库">
      <div class="mt-library-tabs" role="tablist" aria-label="素材类型">
        <button type="button" class="on" role="tab" aria-selected="true" data-library-tab="assets">资产库</button>
        <button type="button" role="tab" aria-selected="false" data-library-tab="subtitles">字幕</button>
        <span></span>
        <button type="button" class="mt-pane-collapse" data-act="collapse-library" title="收起资产库" aria-label="收起资产库">‹</button>
      </div>

      <div class="mt-library-pane on" data-library-pane="assets">
        <label class="mt-search">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <input id="asset-search" type="search" placeholder="搜索素材" aria-label="搜索素材" />
        </label>
        <div class="mt-filter-row">
          <button type="button" data-act="episode-filter">全集⌄</button>
          <button type="button" data-act="type-filter">全部⌄</button>
          <span></span>
          <button type="button" class="mt-view on" data-view="list" aria-label="列表" title="列表">☰</button>
          <button type="button" class="mt-view" data-view="grid" aria-label="图片平铺" title="图片平铺">▦</button>
        </div>
        <div class="mt-folder-bar">
          <button type="button" data-act="new-folder" title="新建文件夹">＋ 文件夹</button>
          <button type="button" class="is-primary" data-act="upload-asset" title="上传图片 / 音频 / 视频">↑ 上传</button>
        </div>
        <div class="mt-assets" id="asset-list"></div>
      </div>

      <div class="mt-library-pane" data-library-pane="subtitles">
        <div class="mt-sub-preset-head">
          <b>字幕样式</b>
          <small>应用到新增字幕</small>
        </div>
        <button type="button" class="mt-sub-preset on" data-sub-style="plain">
          <span class="mt-sub-demo">示例字幕</span>
          <span><b>经典白字</b><small>白色描边</small></span>
        </button>
        <button type="button" class="mt-sub-preset" data-sub-style="yellow">
          <span class="mt-sub-demo yellow">示例字幕</span>
          <span><b>重点黄字</b><small>黑色描边</small></span>
        </button>
        <button type="button" class="mt-sub-preset" data-sub-style="card">
          <span class="mt-sub-demo card">示例字幕</span>
          <span><b>黑底白字</b><small>信息卡片</small></span>
        </button>
      </div>
    </aside>

    <section class="mt-preview-area" aria-label="时间线预览">
      <div class="mt-preview" id="preview">
        <img id="preview-image" alt="当前画面预览" />
        <img id="preview-next" class="mt-preview-next" alt="" hidden />
        <div class="mt-transition-layer" id="transition-layer"></div>
        <button type="button" class="mt-preview-play" data-act="play" aria-label="播放">▶</button>
        <div class="mt-caption-preview" id="caption-preview"></div>
        <div class="mt-transform" id="transform-box" hidden>
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          <button type="button" data-act="nudge-rotate" aria-label="旋转">↻</button>
        </div>
        <div class="mt-generating" id="generating" hidden>重新生成中</div>
      </div>
      <div class="mt-preview-foot">
        <div class="mt-preview-meta" id="preview-meta">片段 01</div>
        <span class="mt-resolution" id="project-resolution" title="当前项目输出分辨率（只读）">720P</span>
      </div>
    </section>

    <aside class="mt-inspector" id="inspector" aria-label="片段设置">
      <div class="mt-inspector-head">
        <h2 id="inspector-title">片段设置</h2>
        <button type="button" data-act="close-inspector" aria-label="关闭调整面板">×</button>
      </div>
      <div class="mt-inspector-body" id="inspector-body">
        <div class="mt-inspector-empty">
          <span>◇</span>
          <p>点选下方片段，可以改画面、缩放和旋转。</p>
        </div>
      </div>
    </aside>

    <section class="mt-timeline" aria-label="时间线">
      <div class="mt-toolbar">
        <div class="mt-play-group">
          <button type="button" class="mt-play" data-act="play" aria-label="播放">▶</button>
          <span><b id="current-time">00:00</b> / <span id="total-time">01:06</span></span>
        </div>
        <div class="mt-tool-group">
          <button type="button" data-act="undo" title="撤销 ⌘Z" aria-label="撤销">↶</button>
          <button type="button" data-act="redo" title="重做 ⌘⇧Z" aria-label="重做">↷</button>
          <i></i>
          <button type="button" data-act="split" title="在播放头位置分割（S）">✂ 分割</button>
          <button type="button" data-act="merge" title="选中片段与后一段合并">合并</button>
          <button type="button" data-act="add-transition" title="在选中片段后添加转场">◇ 转场</button>
          <button type="button" data-act="delete-selection" title="删除选中项（⌫）">删除</button>
          <i></i>
          <button type="button" data-act="remove-subtitles" title="清空字幕轨上的全部字幕（不擦除画面文字）">去字幕</button>
          <button type="button" class="is-purple" data-act="generate-audio" title="根据选中片段的台词字幕生成配音">✦ 生成配音</button>
          <button type="button" data-act="recognize-subtitles" title="智能识别字幕">识别字幕</button>
          <button type="button" data-act="translate-subtitles">字幕翻译</button>
          <button type="button" class="is-purple" data-act="add-subtitle">▣ 添加字幕</button>
        </div>
        <div class="mt-view-tools">
          <button type="button" class="mt-magnet on" data-act="toggle-magnet" aria-pressed="true" title="磁吸：拖动字幕、裁剪片段、拖播放头时，靠近片段边缘或播放头会自动对齐。按住 ⌥ 临时切换">🧲 磁吸开</button>
          <button type="button" data-act="collapse-timeline" aria-label="收起时间线">⌄</button>
          <button type="button" data-act="settings" aria-label="时间轴设置">⚙</button>
          <button type="button" data-act="mute-all" aria-label="静音">♬</button>
          <button type="button" data-act="fullscreen" aria-label="全屏">⛶</button>
          <input id="zoom" type="range" min="10" max="32" value="18" aria-label="缩放时间线" />
        </div>
      </div>

      <div class="mt-editor">
        <div class="mt-track-labels" id="track-labels">
          <div class="mt-ruler-spacer"></div>
        </div>

        <div class="mt-scroll" id="timeline-scroll">
          <div class="mt-canvas" id="timeline-canvas">
            <div class="mt-ruler" id="ruler"></div>
            <div class="mt-tracks" id="track-lanes"></div>
            <div class="mt-snap-marks" id="snap-marks" hidden></div>
            <div class="mt-snap-guide" id="snap-guide" hidden></div>
            <button type="button" class="mt-playhead" id="playhead" aria-label="时间线">
              <i></i><span></span>
            </button>
          </div>
        </div>

        <div class="mt-meter" aria-label="响度显示器">
          <b>响度</b>
          <div class="mt-meter-bars">
            <div class="mt-meter-scale"><span>0</span><span>-6</span><span>-12</span><span>-24</span><span>-48</span></div>
            <div class="mt-meter-bar"><i id="meter-left"></i></div>
            <div class="mt-meter-bar"><i id="meter-right"></i></div>
          </div>
          <small>L&nbsp;&nbsp;R</small>
          <em id="meter-value">—</em>
        </div>
      </div>
    </section>

    <button type="button" class="mt-resizer mt-resizer-left" data-resize="library" aria-label="调整资产库宽度"></button>
    <button type="button" class="mt-resizer mt-resizer-right" data-resize="inspector" aria-label="调整设置栏宽度"></button>
    <button type="button" class="mt-resizer mt-resizer-horizontal" data-resize="timeline" aria-label="调整预览与时间线高度"></button>
  </main>
</div>

<div class="mt-menu" id="context-menu" role="menu" aria-label="片段编辑菜单" hidden></div>
<div class="toast-wrap"></div>

<div class="mt-modal" id="upload-modal" hidden>
  <div class="mt-modal-card" role="dialog" aria-modal="true" aria-labelledby="upload-title">
    <header>
      <h3 id="upload-title">上传素材</h3>
      <button type="button" data-act="close-upload" aria-label="关闭">×</button>
    </header>
    <p class="mt-modal-hint">图片、音频、视频共用此弹窗。多文件可同时上传，单个失败不影响其他文件。</p>
    <label class="mt-dropzone" id="upload-dropzone">
      <input id="upload-input" type="file" multiple accept="video/mp4,video/quicktime,image/*,audio/mpeg,audio/wav,.mp4,.mov,.jpg,.jpeg,.png,.webp,.mp3,.wav" hidden />
      <b>点击或拖入文件</b>
      <small>视频 MP4/MOV ≤30s ≤1080P ≤200MB · 图片 &lt;30MB · 音频 MP3/WAV ≤30s ≤15MB</small>
    </label>
    <ul class="mt-upload-list" id="upload-list"></ul>
    <footer>
      <button type="button" data-act="close-upload">取消</button>
      <button type="button" class="is-primary" data-act="confirm-upload" disabled>开始上传</button>
    </footer>
  </div>
</div>

<div class="mt-modal" id="draft-modal" hidden>
  <div class="mt-modal-card" role="dialog" aria-modal="true" aria-labelledby="draft-title">
    <header><h3 id="draft-title">检测到未保存的编辑</h3></header>
    <p class="mt-modal-hint">本地草稿比服务端更新。是否恢复崩溃前的编辑内容？</p>
    <footer>
      <button type="button" data-act="discard-draft">放弃</button>
      <button type="button" class="is-primary" data-act="restore-draft">恢复</button>
    </footer>
  </div>
</div>

<div class="mt-readonly-banner" id="readonly-banner" hidden>
  该项目正在其他页面编辑，当前为只读；内容以服务端最新保存为准。
</div>

<script src="js/data.js?v=202611032159"></script>
<script src="js/multitrack-state.js?v=202611032159"></script>
<script src="js/multitrack-render.js?v=202611032159"></script>
<script src="js/multitrack-actions.js?v=202611032159"></script>
<script src="js/multitrack-menu.js?v=202611032159"></script>
<script src="js/multitrack-save.js?v=202611032159"></script>
<script src="js/multitrack-export.js?v=202611032159"></script>
<script src="js/multitrack-phase2.js?v=202611032159"></script>
<script src="js/multitrack-editor.js?v=202611032159"></script>
</body>
</html>
